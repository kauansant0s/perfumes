<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style-criar-conta.css">
  <title>Criar Conta</title>
</head>
<body>
  <div class="container">
    <h1 id="titulo-pagina">Criar Conta</h1>
    
    <div class="avatar-area">
      <div class="avatar-selecionado" id="avatar-selecionado">
        <img id="preview-avatar" src="" alt="Avatar selecionado">
      </div>
      <p class="avatar-label">Escolha seu avatar</p>
      <div class="avatar-grade" id="avatar-grade"></div>
    </div>

    <form id="form-criar-conta">
      <div class="campo-grupo">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" class="campo-texto" required>
      </div>

      <div class="campo-grupo" id="campo-email">
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" class="campo-texto" required>
      </div>

      <!-- ✅ NOVO: Botão para trocar senha (só aparece em modo edição) -->
      <div class="campo-grupo" id="campo-botao-senha" style="display: none;">
        <button type="button" id="btn-trocar-senha" class="btn-trocar-senha">
          🔒 Deseja trocar a senha?
        </button>
      </div>

      <div class="campo-grupo" id="campo-senha" style="display: none;">
        <label for="senha" id="label-senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" class="campo-texto">
      </div>

      <div class="campo-grupo" id="campo-confirmar-senha" style="display: none;">
        <label for="confirmar-senha" id="label-confirmar-senha">Confirmar senha:</label><br>
        <input type="password" id="confirmar-senha" name="confirmar-senha" class="campo-texto">
      </div>

      <div class="botoes">
        <button type="button" class="btn-cancelar" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn-criar" id="btn-submit">Criar conta</button>
      </div>
      
      <!-- ✅ NOVO: Botão Deletar Conta (só aparece em modo edição) -->
      <button type="button" class="btn-deletar-conta" id="btn-deletar-conta" style="display: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Deletar Conta
      </button>
    </form>
  </div>

  <script type="module" src="script-criar-conta.js"></script>
</body>
</html>
